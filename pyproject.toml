[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbrobotics-python-utilities"
version = "0.2.0"
description = "Python serial utilities for qbrobotics devices"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["build>=1,<2"]

[project.urls]
Repository = "https://github.com/qbrobotics-ADS/qbrobotics-python-utilities"

[project.scripts]
qbrobotics-test = "qbrobotics_cli:main"

[project.gui-scripts]
qbrobotics-gui = "qbrobotics_gui:main"

[tool.setuptools]
packages = ["qbrobotics_assets"]
py-modules = ["qbrobotics_serial_utils", "qbrobotics_commands", "qbrobotics_cli", "qbrobotics_gui_worker", "qbrobotics_gui"]

[tool.setuptools.package-data]
qbrobotics_assets = ["qb.ico"]
